<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"><rect width="900" height="440" rx="22" fill="#eef5f2"/><g font-family="sans-serif" fill="#173a34"><text x="30" y="40" font-size="18">NAVION · PROVISIONAL / NOT HARDWARE VERIFIED</text><rect x="25" y="65" width="850" height="44" rx="8" fill="white"/><text x="40" y="94" font-size="17">Read left + right → convert calibrated polarity</text><rect x="25" y="118" width="850" height="44" rx="8" fill="white"/><text x="40" y="147" font-size="17">Both black → STOP and inspect</text><rect x="25" y="171" width="850" height="44" rx="8" fill="white"/><text x="40" y="200" font-size="17">One black → turn toward that sensor</text><rect x="25" y="224" width="850" height="44" rx="8" fill="white"/><text x="40" y="253" font-size="17">Both white → forward up to 700 ms</text><rect x="25" y="277" width="850" height="44" rx="8" fill="white"/><text x="40" y="306" font-size="17">Then search last turn ≤1500 ms → latch STOP</text></g></svg>

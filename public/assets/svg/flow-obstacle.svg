<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"><rect width="900" height="440" rx="22" fill="#eef5f2"/><g font-family="sans-serif" fill="#173a34"><text x="30" y="40" font-size="18">NAVION · PROVISIONAL / NOT HARDWARE VERIFIED</text><rect x="25" y="65" width="850" height="44" rx="8" fill="white"/><text x="40" y="94" font-size="17">Read front, left and right</text><rect x="25" y="118" width="850" height="44" rx="8" fill="white"/><text x="40" y="147" font-size="17">Front clear → forward → read again</text><rect x="25" y="171" width="850" height="44" rx="8" fill="white"/><text x="40" y="200" font-size="17">Front blocked → STOP</text><rect x="25" y="224" width="850" height="44" rx="8" fill="white"/><text x="40" y="253" font-size="17">Left clear → left; else right clear → right</text><rect x="25" y="277" width="850" height="44" rx="8" fill="white"/><text x="40" y="306" font-size="17">All blocked → reverse 350 ms → turn 800 ms</text><rect x="25" y="330" width="850" height="44" rx="8" fill="white"/><text x="40" y="359" font-size="17">After timed turn → stop → re-sense</text></g></svg>
